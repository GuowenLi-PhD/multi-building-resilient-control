# System Configuration for Hierarchical Multi-Building Control

system:
  name: "Multi-Building Hierarchical Control with Log-Utility Aggregator"
  buildings: ["Building_A", "Building_B"]

# Feeder constraints
feeder:
  capacity_kW: 50.0
  safety_margin: 0.95  # Use 95% of capacity

# Timing parameters
timing:
  aggregator_timestep: 3600  # 1 hour (seconds)
  building_a_timestep: 900   # 15 minutes
  building_b_timestep: 3600  # 1 hour
  
  # Prediction horizons (steps)
  prediction_horizon_aggregator: 20  # 20 hours
  prediction_horizon_building_a: 4   # 1 hour @ 15-min
  prediction_horizon_building_b: 4   # 4 hours @ 1-hr

# Priority weights for log-utility aggregator
# Higher value = higher priority in allocation
priorities:
  Building_A: 1  # Victim building without TES
  Building_B: 2  # Flexible building with TES

# Building A parameters (no TES)
building_a:
  baseline_power_kW: 8.0
  flexibility_factor: 0.3  # Can vary ±30%

# Building B parameters (with TES)
building_b:
  baseline_power_kW: 12.0
  TES_capacity_kWh: 1152.0
  SOC_min: 0.20
  SOC_max: 0.99
  charge_rate_max_kW: 10.0
  discharge_rate_max_kW: 15.0

# Control weights
weights:
  # Building A
  building_a:
    energy_cost: 1.0
    comfort: 100.0
    budget_constraint: 10.0
    mu_bar: 5.0  # Slack normalization
  
  # Building B  
  building_b:
    energy_cost: 1.0
    comfort: 100.0
    TES_operation: 0.1
    budget_constraint: 10.0
    mu_bar: 8.0

# Attack scenarios path
attack_scenarios_path: 'config/attack_scenarios.yaml'
