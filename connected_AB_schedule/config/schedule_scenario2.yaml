# Scenario 2: User Coordinated Control
# User-defined schedule for building coordination
# Author: Guowen Li, AI Assistant
# Date: 2025-01-20

scenario_name: "User Coordinated Control"

# Building A: User-defined schedule for key variables
building_a:
  control_interval_minutes: 15  # 15-minute control interval
  
  # Daily schedule - MPC will optimize unscheduled variables
  schedule:
    # Night hours: Systems off to save energy
    - time: "00:00"
      controls:
        bcp: 0      # Chiller off
        bahu: 0     # AHU off
    
    # Early morning: Pre-cooling preparation
    - time: "05:00"
      controls:
        bcp: 1      # Chiller on
        bahu: 1     # AHU on
        #Tsa: 12.5   # Aggressive pre-cooling
    
    # Morning: Occupied period starts
    - time: "08:00"
      controls:
        bcp: 1      # Chiller on
        bahu: 1     # AHU on
        #Tsa: 13.0   # Moderate cooling
    
    # Midday: Peak demand period
    - time: "12:00"
      controls:
        bcp: 1      # Chiller on
        bahu: 1     # AHU on
        #Tsa: 14.0   # Reduce cooling intensity to lower peak demand
    
    # Afternoon: Post-peak
    - time: "16:00"
      controls:
        bcp: 1      # Chiller on
        bahu: 1     # AHU on
        #Tsa: 13.5   # Resume normal cooling
    
    # Evening: Unoccupied period starts
    - time: "19:00"
      controls:
        bcp: 0      # Chiller off
        bahu: 0     # AHU off

# Building B: User-defined TES schedule for coordination
building_b:
  control_interval_minutes: 60  # 1-hour control interval
  
  # Daily TES operation schedule
  schedule:
    # Night: Charge TES during off-peak
    - time: "00:00"
      controls:
        uMod: -1    # Charge TES
    
    # # Morning: Coast on stored energy
    # - time: "06:00"
    #   controls:
    #     uMod: 0     # TES off, building coast
    
    # Early morning
    - time: "07:00"
      controls:
        uMod: 2     

    # Late morning
    - time: "07:00"
      controls:
        uMod: 1    
    
    # Peak hours: Discharge TES to reduce building demand and support grid
    - time: "13:00"
      controls:
        uMod: 1     # Discharge TES
    
    # Late afternoon
    - time: "17:00"
      controls:
        uMod: 1
    
    # Evening: Prepare for next day
    - time: "19:00"
      controls:
        uMod: 0     # Off
